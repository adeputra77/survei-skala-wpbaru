<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survei Skala — Komunikasi Pajak untuk Wajib Pajak Baru</title>
<style>
  :root{
    --ink:#16202c; --muted:#5a6b7d; --line:#d7dee6; --bg:#f4f6f9; --card:#fff;
    --accent:#14532d; --accent-soft:#e7f0ea; --warn:#8a4b00; --warn-soft:#fdf3e3;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;}
  header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
         padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600;flex:1 1 320px}
  header .meta{font-size:12.5px;opacity:.92}
  .wrap{max-width:900px;margin:0 auto;padding:16px 16px 120px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:16px 18px;margin:14px 0}
  .card h2{font-size:15px;margin:0 0 4px;color:var(--accent)}
  .card .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
  .item{padding:10px 0;border-top:1px solid #eef2f6}
  .item:first-of-type{border-top:none}
  .q{margin:0 0 7px;font-size:14.5px}
  .q .code{color:var(--muted);font-size:12px;font-weight:600;margin-right:6px}
  .req{color:#b3261e}
  .scale{display:flex;flex-wrap:wrap;gap:6px}
  .scale label{flex:1 1 auto;min-width:64px;text-align:center;border:1px solid var(--line);
    border-radius:8px;padding:7px 6px;cursor:pointer;background:#fbfcfd;font-size:13px}
  .scale label:hover{background:var(--accent-soft)}
  .scale input{position:absolute;opacity:0;width:0;height:0}
  .scale input:checked + span{font-weight:700}
  .scale label:has(input:checked){background:var(--accent);color:#fff;border-color:var(--accent)}
  .endlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 2px 0}
  table.matrix{width:100%;border-collapse:collapse;font-size:13.5px}
  table.matrix th{font-weight:600;color:var(--muted);font-size:12px;padding:6px 3px;text-align:center;
    border-bottom:1px solid var(--line);vertical-align:bottom}
  table.matrix th.rowhead{text-align:left;width:46%}
  table.matrix td{padding:7px 3px;text-align:center;border-bottom:1px solid #eef2f6}
  table.matrix td.rowhead{text-align:left;font-size:13.5px}
  table.matrix tr:hover td{background:#f9fbfc}
  input[type=radio],input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent)}
  input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;font:inherit;background:#fff;max-width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row > div{flex:1 1 180px}
  .row label.fl{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .multi{display:flex;flex-wrap:wrap;gap:8px}
  .multi label{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fbfcfd;
    cursor:pointer;font-size:13.5px;display:flex;gap:7px;align-items:center}
  .multi label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
  footer.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:30}
  button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;
    padding:9px 14px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{font-size:12.5px;color:var(--muted);flex:1 1 220px}
  .note{background:var(--warn-soft);border:1px solid #f0dcb8;color:var(--warn);
    border-radius:var(--radius);padding:10px 12px;font-size:13px;margin:12px 0}
  .pill{background:#fff2;border:1px solid #ffffff55;border-radius:999px;padding:3px 10px;font-size:12.5px}
  .hidden{display:none !important}
  @media (max-width:640px){
    table.matrix th.rowhead{width:auto}
    table.matrix, table.matrix tbody, table.matrix tr, table.matrix td{display:block;width:100%}
    table.matrix thead{display:none}
    table.matrix tr{border-bottom:1px solid var(--line);padding:6px 0}
    table.matrix td{border:none;text-align:left;display:inline-block;width:auto;padding:4px 8px}
    table.matrix td.rowhead{display:block;font-weight:600;padding-bottom:2px}
    table.matrix td::before{content:attr(data-lab);font-size:11px;color:var(--muted);display:block}
  }
  @media print{header,footer.bar{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1 id="appTitle">Survei Skala — Komunikasi Pajak untuk Wajib Pajak Baru</h1>

  <button id="langBtn" type="button">English</button>

/* ---------- Status bahasa ---------- */
let LANG = localStorage.getItem("survey_lang") || "id";
const L = (o)=> (o && (o[LANG] ?? o.id)) || "";

/* ---------- Render ---------- */
const form = document.getElementById("surveyForm");

function scaleRadios(itemId, sc){
  const from = sc.from ?? 1;
  let h = `<div class="scale">`;
  for(let i=0;i<sc.n;i++){
    const v = from + i;
    h += `<label><input type="radio" name="${itemId}" value="${v}"><span>${v}</span></label>`;
  }
  h += `</div><div class="endlab"><span>${L(sc.lo)}</span><span>${L(sc.hi)}</span></div>`;
  return h;
}

function renderItem(it){
  const req = it.req ? ` <span class="req">*</span>` : "";
  let body = "";
  if(it.type==="radio"){
    body = scaleRadios(it.id, S[it.scale]);
  } else if(it.type==="select"){
    body = `<select name="${it.id}"><option value="">—</option>` +
      it.opts.map(o=>`<option value="${o.v}">${LANG==="id"?o.id:o.en}</option>`).join("") + `</select>`;
  } else if(it.type==="text"){
    body = `<input type="text" name="${it.id}" maxlength="40">`;
  } else if(it.type==="email"){
    // inputmode + autocomplete memunculkan papan ketik email dan saran alamat di HP
    body = `<input type="email" name="${it.id}" maxlength="80" inputmode="email"
             autocomplete="email" autocapitalize="off" spellcheck="false"
             placeholder="nama@contoh.com" style="width:min(320px,100%)">`;
  } else if(it.type==="number"){
    body = `<input type="number" name="${it.id}" min="${it.min??0}" max="${it.max??100}" style="width:110px">` +
           (it.unit?` <span style="color:var(--muted);font-size:13px">${L(it.unit)}</span>`:"");
  } else if(it.type==="multi"){
    body = `<div class="multi">` + it.opts.map(o=>
      `<label><input type="checkbox" name="${it.id}" value="${o.v}">${LANG==="id"?o.id:o.en}</label>`).join("") + `</div>`;
  }
  return `<div class="item"><p class="q"><span class="code">${it.id}</span>${L(it.q)}${req}</p>${body}</div>`;
}

function renderMatrix(sectionId, mx){
  const sc = S[mx.scale], from = sc.from ?? 1;
  let head = `<th class="rowhead"></th>`;
  for(let i=0;i<sc.n;i++) head += `<th>${from+i}</th>`;
  let rows = "";
  for(const r of mx.rows){
    let tds = `<td class="rowhead"><span class="code">${r.id}</span> ${LANG==="id"?r.id_t:r.en_t}</td>`;
    for(let i=0;i<sc.n;i++){
      const v = from+i;
      tds += `<td data-lab="${v}"><input type="radio" name="${r.id}" value="${v}"></td>`;
    }
    rows += `<tr>${tds}</tr>`;
  }
  return `<div class="endlab"><span>1 = ${L(sc.lo)}</span><span>${from+sc.n-1} = ${L(sc.hi)}</span></div>
   <div style="overflow-x:auto"><table class="matrix"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}

function render(){
  document.documentElement.lang = LANG;
  document.title = L(UI.title);
  document.getElementById("appTitle").textContent = L(UI.title);
  document.getElementById("introNote").innerHTML = L(UI.intro);
  document.getElementById("saveBtn").textContent = L(UI.save);
  document.getElementById("pickFileBtn").textContent = L(UI.pick);
  document.getElementById("exportBtn").textContent = L(UI.exp);
  document.getElementById("sendBtn").textContent = L(UI.send);
  document.getElementById("clearBtn").textContent = L(UI.clear);
  document.getElementById("langBtn").textContent = L(UI.lang);
  form.innerHTML = SECTIONS.map(sec=>{
    let h = `<section class="card" id="sec-${sec.id}"><h2>${L(sec.t)}</h2>`;
    if(sec.s) h += `<p class="sub">${L(sec.s)}</p>`;
    if(sec.matrix) h += renderMatrix(sec.id, sec.matrix);
    if(sec.items) h += sec.items.map(renderItem).join("");
    return h + `</section>`;
  }).join("");
  applyConditionals();
  updateCount();
}

/* ---------- Bagian bersyarat ----------
   Bagian dengan properti showIf hanya tampil bila jawaban pada field tertentu
   cocok. Saat tersembunyi isiannya dikosongkan, supaya tidak ikut terkirim dan
   tidak dihitung sebagai pertanyaan yang belum dijawab.                        */
function sectionVisible(sec){
  if(!sec.showIf) return true;
  const el = form.querySelector(`[name="${sec.showIf.field}"]`);
  return !!el && el.value === sec.showIf.eq;
}

function hiddenIds(){
  const out = new Set();
  for(const sec of SECTIONS){
    if(sectionVisible(sec)) continue;
    if(sec.matrix) for(const r of sec.matrix.rows) out.add(r.id);
    if(sec.items) for(const it of sec.items) out.add(it.id);
  }
  return out;
}

function applyConditionals(){
  for(const sec of SECTIONS){
    if(!sec.showIf) continue;
    const node = document.getElementById("sec-" + sec.id);
    if(!node) continue;
    const show = sectionVisible(sec);
    node.hidden = !show;
    if(!show){
      node.querySelectorAll("input, select, textarea").forEach(el=>{
        if(el.type === "radio" || el.type === "checkbox") el.checked = false;
        else el.value = "";
      });
    }
  }
}

/* ---------- Daftar kolom ---------- */
function columns(){
  const cols = ["resp_id","timestamp","lang","durasi_detik"];
  for(const sec of SECTIONS){
    if(sec.matrix) for(const r of sec.matrix.rows) cols.push(r.id);
    if(sec.items) for(const it of sec.items) cols.push(it.id);
  }
  return cols;
}

/* ---------- Pengumpulan jawaban ---------- */
let startedAt = Date.now();

function collect(){
  const fd = new FormData(form), out = {};
  for(const c of columns()) out[c] = "";
  for(const sec of SECTIONS){
    if(sec.items) for(const it of sec.items){
      if(it.type==="multi"){ out[it.id] = fd.getAll(it.id).join("|"); }
    }
  }
  for(const [k,v] of fd.entries()){
    if(out[k] !== undefined && out[k] === "") out[k] = v;
  }
  out.resp_id = (crypto.randomUUID ? crypto.randomUUID()
                 : "r-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10));
  out.timestamp = new Date().toISOString();
  out.lang = LANG;
  out.durasi_detik = Math.round((Date.now()-startedAt)/1000);
  return out;
}

function blankCount(obj){
  let n = 0;
  const skip = hiddenIds();
  for(const c of columns()){
    if(["resp_id","timestamp","lang","durasi_detik","SES3"].includes(c)) continue;
    if(skip.has(c)) continue;                  // bagian bersyarat yang tidak tampil
    if(!obj[c]) n++;
  }
  return n;
}

/* ---------- Pengiriman ke Google Sheet (opsional) ----------
   Alamat web app dan kuncinya TIDAK ditanam di halaman ini, karena halaman ini
   publik. Pewawancara membuka tautan yang memuat keduanya satu kali:

     https://.../survei-skala-wpbaru/?e=<URL web app>&k=<kunci>

   Setelah itu keduanya disimpan di peramban perangkat tersebut dan dibersihkan
   dari address bar. Tanpa keduanya, halaman tetap berjalan sepenuhnya luring:
   jawaban hanya masuk ke berkas CSV seperti sebelumnya.                        */
const CFGKEY = "survey_endpoint_v1";

function loadCfg(){
  const q = new URLSearchParams(location.search);
  if(q.get("e")){
    const cfg = { endpoint: q.get("e"), key: q.get("k") || "" };
    try{ localStorage.setItem(CFGKEY, JSON.stringify(cfg)); }catch(e){}
    history.replaceState({}, "", location.pathname);   // jangan tinggalkan kunci di address bar
    return cfg;
  }
  try{ return JSON.parse(localStorage.getItem(CFGKEY) || "null"); }catch(e){ return null; }
}
let CFG = loadCfg();

async function sendOne(rec){
  if(!CFG || !CFG.endpoint) return false;
  try{
    // text/plain menghindari preflight CORS, yang tidak dilayani Apps Script
    const res = await fetch(CFG.endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ key: CFG.key, columns: columns(), row: rec })
    });
    if(!res.ok) return false;
    const out = await res.json().catch(()=>({ ok:true }));
    return out.ok !== false;
  }catch(e){ return false; }
}

/* Antrean: jawaban yang belum sampai tetap tersimpan dan dicoba lagi nanti. */
async function flushQueue(){
  if(!CFG || !CFG.endpoint) return 0;
  const all = getAll();
  let sent = 0;
  for(const r of all){
    if(r._sent) continue;
    if(await sendOne(r)){ r._sent = true; sent++; } else break;   // berhenti saat gagal
  }
  setAll(all); updateCount();
  return sent;
}

const pending = ()=> getAll().filter(r => !r._sent).length;

/* ---------- Penyimpanan ---------- */
const LSKEY = "survey_responses_v1";
const getAll = ()=> JSON.parse(localStorage.getItem(LSKEY) || "[]");
const setAll = (a)=> localStorage.setItem(LSKEY, JSON.stringify(a));

function csv(rows){
  const cols = columns();
  const esc = (s)=>{ s = (s??"").toString(); return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  return "﻿" + [cols.join(",")].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(","))).join("\r\n") + "\r\n";
}

/* Berkas tujuan disimpan di IndexedDB agar tetap dikenali setelah peramban ditutup. */
let fileHandle = null;
const idb = {
  db:null,
  open(){ return new Promise(res=>{ const q = indexedDB.open("surveyStore",1);
    q.onupgradeneeded = ()=> q.result.createObjectStore("kv");
    q.onsuccess = ()=>{ idb.db = q.result; res(idb.db); }; q.onerror = ()=> res(null); }); },
  async get(k){ const db = idb.db || await idb.open(); if(!db) return null;
    return new Promise(res=>{ const t = db.transaction("kv").objectStore("kv").get(k);
      t.onsuccess = ()=> res(t.result || null); t.onerror = ()=> res(null); }); },
  async set(k,v){ const db = idb.db || await idb.open(); if(!db) return;
    return new Promise(res=>{ const t = db.transaction("kv","readwrite").objectStore("kv").put(v,k);
      t.onsuccess = ()=> res(); t.onerror = ()=> res(); }); }
};

const supportsFS = typeof window.showSaveFilePicker === "function";

async function pickFile(){
  if(!supportsFS){ alert(L(UI.unsupported)); return; }
  try{
    fileHandle = await window.showSaveFilePicker({
      suggestedName: "respon_survei_skala.csv",
      types:[{description:"CSV", accept:{"text/csv":[".csv"]}}]
    });
    await idb.set("fileHandle", fileHandle);
    await writeAll();
    setStatus();
  }catch(e){ /* dibatalkan pengguna */ }
}

async function ensurePermission(h){
  if(!h) return false;
  const opts = {mode:"readwrite"};
  if(await h.queryPermission(opts) === "granted") return true;
  return await h.requestPermission(opts) === "granted";
}

async function writeAll(){
  if(!fileHandle) return false;
  if(!await ensurePermission(fileHandle)) return false;
  const w = await fileHandle.createWritable();
  await w.write(csv(getAll()));
  await w.close();
  return true;
}

function download(name, text){
  const b = new Blob([text], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function setStatus(msg){
  const el = document.getElementById("status");
  if(msg){ el.textContent = msg; return; }
  if(!supportsFS){ el.textContent = L(UI.unsupported); document.getElementById("pickFileBtn").disabled = true; return; }
  el.textContent = fileHandle ? L(UI.fileOk) + fileHandle.name : L(UI.noFile);
}

function updateCount(){
  const n = getAll().length, q = pending();
  const sendBtn = document.getElementById("sendBtn");
  document.getElementById("countPill").textContent =
    L(UI.count) + n + (CFG && CFG.endpoint ? " · " + L(UI.queued) + q : "");
  if(sendBtn){
    sendBtn.hidden = !(CFG && CFG.endpoint);
    sendBtn.disabled = q === 0;
  }
}

/* ---------- Tombol ---------- */
document.getElementById("saveBtn").addEventListener("click", async ()=>{
  const data = collect();
  if(!data.SES1){ alert(L(UI.needCode)); return; }
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.SES1.trim())){ alert(L(UI.badEmail)); return; }
  const miss = blankCount(data);
  if(miss > 0 && !confirm(L(UI.confirmBlank).replace("%n", miss))) return;
  const all = getAll(); all.push(data); setAll(all);
  let ok = false;
  try{ ok = await writeAll(); }catch(e){ ok = false; }

  // Kirim lebih dahulu, baru putuskan perlu unduh atau tidak. Di HP tidak ada
  // penulisan berkas, jadi tanpa urutan ini setiap jawaban akan memicu satu
  // unduhan CSV, padahal jawabannya sudah masuk ke Google Sheet.
  let sentMsg = "";
  let sentNow = false;
  if(CFG && CFG.endpoint){
    await flushQueue();
    const q = pending();
    sentNow = q === 0;
    sentMsg = "\n" + (sentNow ? L(UI.sentOk) : L(UI.sentQueued).replace("%n", q));
  }
  // unduhan per jawaban hanya sebagai jaring pengaman: tidak ada berkas tujuan
  // DAN jawaban belum sampai ke Sheet
  if(!ok && !sentNow) download("respon_" + data.SES1.replace(/[^A-Za-z0-9_-]/g,"") + ".csv", csv([data]));
  form.reset(); startedAt = Date.now(); updateCount(); setStatus();
  window.scrollTo({top:0,behavior:"smooth"});
  alert((ok ? L(UI.saved) : L(UI.savedDl)) + sentMsg);
});

form.addEventListener("change", (e)=>{
  if(e.target && e.target.name === "BG0") applyConditionals();
});

document.getElementById("pickFileBtn").addEventListener("click", pickFile);

document.getElementById("sendBtn").addEventListener("click", async ()=>{
  if(pending() === 0){ alert(L(UI.sendNone)); return; }
  const sent = await flushQueue();
  alert(sent > 0 ? L(UI.sentQueued).replace("%n", pending()).replace(/^0 /, "")
                 : L(UI.sendFail));
  updateCount();
});

document.getElementById("exportBtn").addEventListener("click", ()=>{
  const all = getAll();
  if(!all.length){ alert("0"); return; }
  download("respon_survei_skala_" + new Date().toISOString().slice(0,10) + ".csv", csv(all));
});

document.getElementById("clearBtn").addEventListener("click", ()=>{
  if(!confirm(L(UI.confirmClear))) return;
  localStorage.removeItem(LSKEY); updateCount();
});

document.getElementById("langBtn").addEventListener("click", ()=>{
  const data = collect();
  LANG = LANG === "id" ? "en" : "id";
  localStorage.setItem("survey_lang", LANG);
  render();
  for(const [k,v] of Object.entries(data)){
    if(!v || ["timestamp","lang","durasi_detik"].includes(k)) continue;
    const els = form.querySelectorAll(`[name="${k}"]`);
    els.forEach(el=>{
      if(el.type==="radio"||el.type==="checkbox"){ if(v.split("|").includes(el.value)) el.checked = true; }
      else el.value = v;
    });
  }
  setStatus();
});

/* ---------- Mulai ---------- */
(async function init(){
  render();
  if(CFG && CFG.endpoint) flushQueue();      // kirim sisa antrean begitu halaman dibuka
  const h = await idb.get("fileHandle");
  if(h){ fileHandle = h; }
  setStatus();
})();
</script>
</body>
